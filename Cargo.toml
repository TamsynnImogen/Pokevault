[package]
name = "universal-pokemon-vault"
version = "0.1.0"
edition = "2021"
description = "Source-preserving Pokemon Vault and emulator backend"
license = "MIT"

[workspace]
members = [".", "desktop"]
default-members = ["."]
resolver = "2"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libloading = "0.8"
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
