[package]
name = "pokemon-vault-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Tauri desktop shell for Universal Pokemon Vault"
license = "MIT"

[features]
# Direct cargo builds are standalone apps with embedded frontend assets.
# Opt out only when deliberately using Vite's development server.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "pokemon-vault-desktop"
path = "src/main.rs"

[dependencies]
universal-pokemon-vault = { path = ".." }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2" }
